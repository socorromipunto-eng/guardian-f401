name: M15 Semantic Governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-governance:
    name: M15 Semantic Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository text encoding
        run: |
          python tools/check_repository_encoding.py --repo .

      - name: Run governance tooling regression suite
        run: |
                    # Includes versioned semantic contract tests for project-state and document-register.
          python -m unittest discover -s tests/governance_tooling -p "test_*.py" -v

      - name: Validate M15 semantic registry
        run: |
          python -m tools.governance_tooling --repo . semantic-validate --registry governance/semantic/m15-semantic-registry.json

      - name: Validate release and publication coherence
        run: |
          python tools/check_release_coherence.py --repo .

      - name: Verify v0.15.0 release manifest against immutable Git blobs
        run: |
          python tools/release_manifest.py --repo . verify --ref v0.15.0 --manifest release-evidence/release-file-sha256-v0.15.0.csv
      - name: Validate current governance project-state integrity
        run: python tools/validate_project_state.py --repo .

      - name: Validate registered document integrity
        run: python tools/validate_document_register.py --repo .
