name: M15 Semantic Governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-governance:
    name: M15 Semantic Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r governance/requirements-governance.in

      - name: Validate repository text encoding
        run: |
          python tools/check_repository_encoding.py --repo .

      - name: Run governance tooling regression suite
        run: |
          # Includes versioned semantic contract tests for project-state and document-register.
          python -m unittest discover -s tests/governance_tooling -p "test_*.py" -v

      - name: Validate M15 semantic registry
        run: |
          python -m tools.governance_tooling --repo . semantic-validate --registry governance/semantic/m15-semantic-registry.json

      - name: Validate release and publication coherence
        run: |
          python tools/check_release_coherence.py --repo .

      - name: Verify v0.15.0 release manifest against immutable Git blobs
        run: |
          python tools/release_manifest.py --repo . verify --ref v0.15.0 --manifest release-evidence/release-file-sha256-v0.15.0.csv
      - name: Validate current governance project-state integrity
        shell: bash
        run: |
          schema_version="$(python -c 'import json,pathlib; print(json.loads(pathlib.Path("governance/project-state.json").read_text(encoding="utf-8"))["schema_version"])')"
          case "$schema_version" in
            "1.0.0")
              python tools/validate_project_state.py --repo .
              ;;
            "2.0.0")
              python tools/validate_project_state_v2.py --repo . --project-state governance/project-state.json --materialization-commit 3f81869ab39321792e56822e0a71703ad1c0acb9
              ;;
            *)
              echo "PROJECT_STATE_VALIDATION=FAIL"
              echo "REASON=UNKNOWN_PROJECT_STATE_SCHEMA_VERSION:$schema_version"
              exit 2
              ;;
          esac

      - name: Validate registered document integrity
        run: python tools/validate_document_register.py --repo .
