# Give the portable firmware verification workflow a clear name.
name: Guardian Firmware Middleware Tests

# Run portable C verification whenever changes reach GitHub.
on:
  # Validate direct pushes to main.
  push:
    branches:
      - main

  # Validate pull requests before merge.
  pull_request:

# Grant only repository read access.
permissions:
  contents: read

# Define strict portable embedded verification.
jobs:
  embedded:
    # Use the GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
      # Download repository source.
      - name: Check out repository
        uses: actions/checkout@v7

      # Keep generated binaries outside source directories.
      - name: Prepare build directory
        run: mkdir -p build

      # Compile the embedded-link regression suite with M8 dependencies.
      - name: Compile embedded command middleware tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Platform/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          -Ifirmware/Health/Inc
          -Ifirmware/Control/Inc
          -Ifirmware/Security/Inc
          -Ifirmware/Firmware/Inc
          firmware/Protocol/Src/guardian_protocol.c
          firmware/Protocol/Src/guardian_parser.c
          firmware/App/Src/guardian_device_service.c
          firmware/Telemetry/Src/guardian_telemetry.c
          firmware/DSP/Src/guardian_dsp.c
          firmware/Health/Src/guardian_health.c
          firmware/Control/Src/guardian_control.c
          firmware/Security/Src/guardian_crypto.c
          firmware/Security/Src/guardian_security.c
          firmware/Firmware/Src/guardian_firmware_lifecycle.c
          firmware/Platform/Src/guardian_embedded_link.c
          firmware/Tests/embedded_link_host_test.c
          -lm
          -o build/embedded_link_host_test

      # Run the embedded-link regression suite.
      - name: Run embedded command middleware tests
        run: ./build/embedded_link_host_test

      # Compile the asynchronous telemetry regression suite with M8 dependencies.
      - name: Compile telemetry middleware tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Platform/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          -Ifirmware/Health/Inc
          -Ifirmware/Control/Inc
          -Ifirmware/Security/Inc
          -Ifirmware/Firmware/Inc
          firmware/Protocol/Src/guardian_protocol.c
          firmware/Protocol/Src/guardian_parser.c
          firmware/App/Src/guardian_device_service.c
          firmware/Telemetry/Src/guardian_telemetry.c
          firmware/DSP/Src/guardian_dsp.c
          firmware/Health/Src/guardian_health.c
          firmware/Control/Src/guardian_control.c
          firmware/Security/Src/guardian_crypto.c
          firmware/Security/Src/guardian_security.c
          firmware/Firmware/Src/guardian_firmware_lifecycle.c
          firmware/Platform/Src/guardian_embedded_link.c
          firmware/Tests/telemetry_host_test.c
          -lm
          -o build/telemetry_host_test

      # Run the M5 telemetry regression suite.
      - name: Run telemetry middleware tests
        run: ./build/telemetry_host_test

      # Compile the M6 acquisition regression suite.
      - name: Compile M6 acquisition tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          firmware/Acquisition/Src/guardian_acquisition.c
          firmware/Tests/acquisition_host_test.c
          -o build/acquisition_host_test

      # Run the M6 acquisition regression suite.
      - name: Run M6 acquisition tests
        run: ./build/acquisition_host_test

      # Compile the M7 DSP regression suite.
      - name: Compile M7 DSP tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          firmware/DSP/Src/guardian_dsp.c
          firmware/Tests/dsp_host_test.c
          -lm
          -o build/dsp_host_test

      # Run the M7 DSP regression suite.
      - name: Run M7 DSP tests
        run: ./build/dsp_host_test

      # Compile the new M8 baseline and anomaly model.
      - name: Compile M8 health tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          -Ifirmware/Health/Inc
          firmware/Health/Src/guardian_health.c
          firmware/Tests/health_host_test.c
          -lm
          -o build/health_host_test

      # Run baseline, anomaly and hysteresis assertions.
      - name: Run M8 health tests
        run: ./build/health_host_test


      # Compile the new M9 supervisory-control state machine.
      - name: Compile M9 control tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          -Ifirmware/Health/Inc
          -Ifirmware/Control/Inc
          firmware/Control/Src/guardian_control.c
          firmware/Tests/control_host_test.c
          -o build/control_host_test

      # Run M9 arm, local-run, degraded, fault-latch and recovery assertions.
      - name: Run M9 control tests
        run: ./build/control_host_test


      # Compile M9 supervisory integration through the complete embedded link.
      - name: Compile M9 control link integration tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Platform/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          -Ifirmware/Health/Inc
          -Ifirmware/Control/Inc
          -Ifirmware/Security/Inc
          -Ifirmware/Firmware/Inc
          firmware/Protocol/Src/guardian_protocol.c
          firmware/Protocol/Src/guardian_parser.c
          firmware/App/Src/guardian_device_service.c
          firmware/Telemetry/Src/guardian_telemetry.c
          firmware/DSP/Src/guardian_dsp.c
          firmware/Health/Src/guardian_health.c
          firmware/Control/Src/guardian_control.c
          firmware/Security/Src/guardian_crypto.c
          firmware/Security/Src/guardian_security.c
          firmware/Firmware/Src/guardian_firmware_lifecycle.c
          firmware/Platform/Src/guardian_embedded_link.c
          firmware/Tests/control_link_host_test.c
          -lm
          -o build/control_link_host_test

      # Run host ARM, local-run, legacy-state authority and interlock fault integration.
      - name: Run M9 control link integration tests
        run: ./build/control_link_host_test


      # Compile the M10 cryptographic primitives and authenticated-session policy.
      - name: Compile M10 security tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/Security/Inc
          -Ifirmware/Firmware/Inc
          firmware/Security/Src/guardian_crypto.c
          firmware/Security/Src/guardian_security.c
          firmware/Tests/security_host_test.c
          -o build/security_host_test

      # Run SHA-256, HMAC, challenge-response, session-key and anti-replay assertions.
      - name: Run M10 security tests
        run: ./build/security_host_test

      # Compile M10 authentication through the complete transport-independent embedded link.
      - name: Compile M10 security link integration tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/Protocol/Inc
          -Ifirmware/App/Inc
          -Ifirmware/Platform/Inc
          -Ifirmware/Telemetry/Inc
          -Ifirmware/Acquisition/Inc
          -Ifirmware/DSP/Inc
          -Ifirmware/Health/Inc
          -Ifirmware/Control/Inc
          -Ifirmware/Security/Inc
          -Ifirmware/Firmware/Inc
          firmware/Protocol/Src/guardian_protocol.c
          firmware/Protocol/Src/guardian_parser.c
          firmware/App/Src/guardian_device_service.c
          firmware/Telemetry/Src/guardian_telemetry.c
          firmware/DSP/Src/guardian_dsp.c
          firmware/Health/Src/guardian_health.c
          firmware/Control/Src/guardian_control.c
          firmware/Security/Src/guardian_crypto.c
          firmware/Security/Src/guardian_security.c
          firmware/Firmware/Src/guardian_firmware_lifecycle.c
          firmware/Platform/Src/guardian_embedded_link.c
          firmware/Tests/security_link_host_test.c
          -lm
          -o build/security_link_host_test

      # Run direct-gate, authenticated dispatch and replay-rejection integration.
      - name: Run M10 security link integration tests
        run: ./build/security_link_host_test
      # Compile the C5-R1 authenticated NodeLink receive-boundary tests.
      - name: Compile C5-R1 NodeLink authentication tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/NodeLink/Inc
          firmware/NodeLink/Src/guardian_node_link.c
          firmware/NodeLink/Src/guardian_node_link_auth.c
          firmware/Tests/node_link_auth_host_test.c
          -o build/node_link_auth_host_test

      # Run hostile authentication-boundary assertions.
      - name: Run C5-R1 NodeLink authentication tests
        run: ./build/node_link_auth_host_test
      # Compile C5-R2 authenticated semantic-binding tests.
      - name: Compile C5-R2 NodeLink semantic compatibility tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/NodeLink/Inc
          firmware/NodeLink/Src/guardian_node_link.c
          firmware/NodeLink/Src/guardian_node_link_auth.c
          firmware/NodeLink/Src/guardian_node_link_semantic.c
          firmware/Tests/node_link_semantic_host_test.c
          -o build/node_link_semantic_host_test

      # Run fail-closed semantic-binding and compatibility assertions.
      - name: Run C5-R2 NodeLink semantic compatibility tests
        run: ./build/node_link_semantic_host_test
      # Compile C5-R3A/R3B/R3C freshness, persistence, and codec hostile tests.
      - name: Compile C5-R3A/R3B/R3C NodeLink freshness tests
        run: >
          gcc
          -std=c11
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/NodeLink/Inc
          -Ifirmware/Security/Inc
          firmware/Security/Src/guardian_crypto.c
          firmware/NodeLink/Src/guardian_node_link_freshness.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence_codec.c
          firmware/Tests/node_link_freshness_host_test.c
          -o build/node_link_freshness_host_test

      # Run fail-closed R3A/R3B/R3C freshness and canonical-codec assertions.
      - name: Run C5-R3A/R3B/R3C NodeLink freshness tests
        run: ./build/node_link_freshness_host_test
      # C5-R3C-E physical persistence backend verification.
      #
      # Security semantics:
      # - host persistence validation does not demonstrate target durability;
      # - dual-slot recovery does not establish rollback resistance;
      # - persistence does not establish freshness, authority, or actuation authority;
      # - HAL simulation does not constitute hardware flash validation.
      #
      # Compile the portable R3C-E physical backend without optimization.
      - name: Compile C5-R3C-E physical persistence backend tests O0
        run: >
          gcc
          -std=c11
          -O0
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/NodeLink/Inc
          -Ifirmware/Security/Inc
          firmware/Security/Src/guardian_crypto.c
          firmware/NodeLink/Src/guardian_node_link_freshness.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence_codec.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence_backend.c
          firmware/Tests/node_link_freshness_persistence_backend_host_test.c
          -o build/node_link_freshness_persistence_backend_host_test_o0

      # Run power-loss, torn-write, corruption, recovery, and NOR-semantics assertions.
      - name: Run C5-R3C-E physical persistence backend tests O0
        run: ./build/node_link_freshness_persistence_backend_host_test_o0

      # Repeat the exact portable backend suite with optimization enabled.
      - name: Compile C5-R3C-E physical persistence backend tests O2
        run: >
          gcc
          -std=c11
          -O2
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ifirmware/NodeLink/Inc
          -Ifirmware/Security/Inc
          firmware/Security/Src/guardian_crypto.c
          firmware/NodeLink/Src/guardian_node_link_freshness.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence_codec.c
          firmware/NodeLink/Src/guardian_node_link_freshness_persistence_backend.c
          firmware/Tests/node_link_freshness_persistence_backend_host_test.c
          -o build/node_link_freshness_persistence_backend_host_test_o2

      # Verify optimized execution preserves the tested backend contract.
      - name: Run C5-R3C-E physical persistence backend tests O2
        run: ./build/node_link_freshness_persistence_backend_host_test_o2

      # Build isolated host-only HAL include stubs.
      #
      # The C3C test defines the controlled HAL API surface and injects HAL failures.
      # These empty headers satisfy production include names without pretending to
      # provide STM32 hardware behavior.
      - name: Prepare C5-R3C-E HAL adapter host-test boundary
        run: |
          mkdir -p build/r3ce-hal-stubs
          printf '%s\n' '/* R3C-E CI host-only HAL include stub. */' > build/r3ce-hal-stubs/stm32f4xx_hal.h
          printf '%s\n' '/* R3C-E CI host-only HAL include stub. */' > build/r3ce-hal-stubs/stm32f4xx_hal_flash.h
          printf '%s\n' '/* R3C-E CI host-only HAL include stub. */' > build/r3ce-hal-stubs/stm32f4xx_hal_flash_ex.h

      # Compile the STM32F401 HAL adapter hostile contract harness.
      #
      # This is a host contract test only. It does not demonstrate real STM32 flash
      # programming, linker reservation, endurance, or power-loss behavior.
      - name: Compile C5-R3C-E STM32F401 HAL adapter contract tests
        run: >
          gcc
          -std=c11
          -O2
          -Wall
          -Wextra
          -Wpedantic
          -Werror
          -Ibuild/r3ce-hal-stubs
          -Ifirmware/NodeLink/Inc
          firmware/Tests/node_link_freshness_persistence_stm32f401_adapter_host_test.c
          -o build/node_link_freshness_persistence_stm32f401_adapter_host_test

      # Run HAL boundary, geometry, error propagation, bounds, and byte-program tests.
      - name: Run C5-R3C-E STM32F401 HAL adapter contract tests
        run: ./build/node_link_freshness_persistence_stm32f401_adapter_host_test
