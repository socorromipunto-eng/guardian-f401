# Give the guardianctl verification workflow a clear name.
name: Guardian Console Tests

# Run host-console verification whenever changes reach GitHub.
on:
  # Validate direct pushes.
  push:
    # Restrict direct-push validation to main.
    branches:
      # Validate every main commit.
      - main

  # Validate pull requests.
  pull_request:

# Grant only repository read access.
permissions:
  # Allow source checkout.
  contents: read

# Define complete host verification.
jobs:
  # Exercise TCP and injected-fake serial abstractions.
  guardianctl:
    # Use the GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    # Execute verification steps.
    steps:
      # Download source.
      - name: Check out repository
        # Use official checkout action.
        uses: actions/checkout@v6

      # Install Python.
      - name: Set up Python
        # Use official Python setup action.
        uses: actions/setup-python@v6
        # Configure deterministic runtime.
        with:
          # Match existing workflows.
          python-version: "3.12"

      # Run protocol tests.
      - name: Run Guardian Protocol tests
        # Expose local protocol package.
        run: PYTHONPATH=protocol/python python -m unittest discover -s protocol/python/tests -v

      # Run simulator tests.
      - name: Run Guardian simulator tests
        # Expose protocol and simulator packages.
        run: PYTHONPATH=protocol/python:simulator/src python -m unittest discover -s simulator/tests -v

      # Run console and fake serial tests.
      - name: Run guardianctl tests
        # Expose protocol, simulator and console packages.
        run: PYTHONPATH=protocol/python:simulator/src:console/src python -m unittest discover -s console/tests -v
