# Give the M3 guardianctl verification workflow a clear GitHub Actions name.
name: Guardian Console Tests

# Run host-console verification whenever relevant changes reach GitHub.
on:
  # Validate changes pushed directly to the stable project branch.
  push:
    # Restrict direct-push validation to main.
    branches:
      # Validate every published main commit.
      - main

  # Validate proposed host-console changes before merge.
  pull_request:

# Grant the workflow only the repository read permission it requires.
permissions:
  # Allow checkout to read source files.
  contents: read

# Define the complete host-console verification job.
jobs:
  # Exercise guardianctl against the real M2 loopback simulator.
  guardianctl:
    # Use the current GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    # Execute every M3 verification step in order.
    steps:
      # Download repository source into the isolated runner workspace.
      - name: Check out repository
        # Use the current official checkout major release.
        uses: actions/checkout@v6

      # Install the selected stable Python runtime.
      - name: Set up Python
        # Use the current official Python setup major release.
        uses: actions/setup-python@v6
        # Configure a deterministic runtime version.
        with:
          # Keep compatibility aligned with the previous project workflows.
          python-version: "3.12"

      # Re-run the shared Guardian Protocol test suite first.
      - name: Run Guardian Protocol tests
        # Expose the repository-local protocol package to this process.
        run: PYTHONPATH=protocol/python python -m unittest discover -s protocol/python/tests -v

      # Re-run the M2 simulator test suite before testing host integration.
      - name: Run Guardian simulator tests
        # Expose the protocol and simulator packages to this process.
        run: PYTHONPATH=protocol/python:simulator/src python -m unittest discover -s simulator/tests -v

      # Run guardianctl unit and integration tests against the simulator.
      - name: Run guardianctl tests
        # Expose protocol, simulator and console packages to this process.
        run: PYTHONPATH=protocol/python:simulator/src:console/src python -m unittest discover -s console/tests -v
